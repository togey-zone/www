# Site settings
title: TOGEY Zone
tagline: A calmer front door for the TOGEY ecosystem
description: >-
  TOGEY Zone is the public portal for TOGEY LIMITED, mapping the company,
  its domain matrix, and the staged rebuild of its digital product ecosystem.
baseurl: ""
url: "https://zone.togey.com"

# Company info
company:
  name_en: TOGEY LIMITED
  name_zh: 桃吉有限公司
  founded: 2015
  registration: Hong Kong SAR
  email: contact@togey.com

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Minima theme settings
minima:
  skin: classic
  date_format: "%Y-%m-%d"

# Collections
collections:
  domains:
    output: false
  
# Defaults
defaults:
  - scope:
      path: ""
    values:
      lang: en
      layout: default

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .github/
